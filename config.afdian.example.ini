[site]
; 来源名：决定归档子文件夹名
; 注意：**不能含空格**（与其它来源同理，本机 sync.ps1 的老坑）
source_name = 爱发电

[creators]
; 监测的爱发电作者，每行一个：<slug> = <user_id>
;   slug 就是 afdian.com/a/<slug> 里那截（如 afdian.com/a/4517xx → 4517xx）
;   user_id 可以留空 —— 程序会自动按 slug 解析并缓存进 state
;
; ⚠️ slug **大小写敏感**：它同时用作归档目录名和状态文件名
;    （4517xx → out/爱发电/4517xx/ + state.afdian.4517xx.json）
;
; 行尾可以写 `; 说明` 做备注（解析器认行内注释，见 poller.load_config）。
;
; 产出**按作者分目录**：out/爱发电/<slug>/ 各一份 CSV / images / index.html，
; 同步回本机就是 _Mod每日汇总/爱发电/<slug>/。
;
; 怎么找作者：调 `GET afdian.com/api/creator/list?q=<关键词>`（匿名可用）。
; ⚠️ 别用 `/api/creator/search` —— 那个要登录，会让人误判成"爱发电搜不了"。
;
; 加一个作者 = 加一行，重启服务即可。新作者首轮会**全量建档但不推送通知**。
4517xx =    ; 辉映星辰允如光（鸣潮服装 mod）

[notify]
enabled = true
; PushPlus token（主通道，免费实名用户 200 次/天；留空则只用 Server酱）
pushplus_token =
; Server酱 SendKey（兜底：PushPlus 失败时才用）
serverchan_key =
