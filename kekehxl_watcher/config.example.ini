[site]
; 来源名：本地汇总目录会按此名建子文件夹（_Mod每日汇总/<source_name>/）
source_name = 可可站
; 站点根地址（2026-10-20 由 kekehxl.org 迁至 mowink.org）
base_url = https://www.mowink.org
; 站点访问密码（WordPress password-protected）
password = mowink
; 只监控的分类 ID：21=鸣潮Mod，139=终末地Mod
category_id = 21
; 分类显示名
category_name = 鸣潮Mod
; cookie 保存路径
cookie_jar = cookies.json

[notify]
enabled = true
; PushPlus token（主通道，免费实名用户 200 次/天；留空则只用 Server酱）
pushplus_token =
; Server酱 SendKey（兜底：PushPlus 失败时才用）
serverchan_key =
; 单个新 mod 是否也单独推送（false = 一轮合并成一条）
per_item = false

[storage]
out_dir = out
state_file = state.json
; csv 编码：utf-8-sig 便于 Excel 直接打开中文
csv_encoding = utf-8-sig

[poll]
interval_minutes = 10
; 首次运行是否把当日已有的全部 mod 作为基线归档（不发"新发现"推送，只发一条汇总）
first_run_baseline = true
; 单次请求超时（秒）
http_timeout = 30
; 失败重试次数
retry = 3
