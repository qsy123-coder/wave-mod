name: Quality Checks

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      # 数据库迁移后应用只读 DATABASE_URL（自建 PostgreSQL）。
      # 未配置该 secret 时构建会回退到仓库内打包容的兜底快照，仍然能过。
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
      COS_BUCKET: wave-mod-preview-1327973389
      COS_REGION: ap-guangzhou
      ALIYUN_OSS_BUCKET: wave-mod
      ALIYUN_OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
      ALIYUN_OSS_REGION: oss-cn-hangzhou

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test
