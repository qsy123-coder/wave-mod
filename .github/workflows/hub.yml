name: Deploy Hub Page

# 永久发布页中转站：push hub/** 后自动部署到 Cloudflare Pages。
# 产出 https://wavemod-hub.pages.dev（及已挂载的自定义域名）。
# 首次运行会自动创建 Pages 项目 wavemod-hub。详见 hub/README.md。

on:
  push:
    paths:
      - 'hub/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy hub to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            # 新版 wrangler pages deploy 要求项目已存在；首次部署先建项目，已存在则跳过
            wrangler pages project create wavemod-hub --production-branch=main || echo "project already exists, continuing"
          command: pages deploy hub/ --project-name=wavemod-hub --branch=main
