[site]
; 来源名：决定本地/云端子文件夹名
source_name = arca.live
base_url = https://arca.live
; 频道 slug
board = thingzyoa
; 只抓 Mod 相关分类：modRecom / WWMI / enFielMd
categories = modRecom,WWMI,enFielMd

[notify]
enabled = true
; PushPlus token（主通道，免费实名用户 200 次/天；留空则只用 Server酱）
pushplus_token =
; Server酱 SendKey（兜底：PushPlus 失败时才用）
serverchan_key =

[storage]
out_dir = out
state_file = state.arca.json
csv_encoding = utf-8-sig

[poll]
interval_minutes = 15
first_run_baseline = true
cf_wait_seconds = 6

; ---------------------------------------------------------------
; 以下两节只在本机下载任务（run_arca_download.py）里使用，服务器忽略
; ---------------------------------------------------------------

[net]
; arca.live 帖子页需要梯子（服务器直连可以，本机直连会被 Cloudflare 挂住）
; auto = 读系统代理 + 探测常见端口（Clash 7897 等）；off = 直连
proxy = auto
autostart = true
; 代理端口通、但目标站点访问不了（节点掉线）时，自动通过 Clash Verge 的
; 命名管道 \\.\pipe\verge-mihomo 切到一个能访问目标站点的节点；切不了再直连。
auto_switch_node = true
app_path =
autostart_wait = 40

[download]
; 图片 + Mod 文件落到 <dest_dir>\W-YYYY.MM.DD\，与 GameBanana 下载任务一致
enabled = true
dest_dir = D:\BaiduNetdiskDownload\MC-MOD整合包\wMOD全集-每日更新\A_每日更新
folder_prefix = W-
; 空则自动用 <dest_dir>\_Mod每日汇总\<source_name>\all_mods.csv
csv_path =
images = true
; 是否下载 kio.ac / nahida.live 里的 Mod 文件
files = true
; 帖子里的 mp4 预览视频（默认不下载，和现有每日更新习惯一致）
include_video = false
; 频道公告帖里的共用密码（「Channel standard password = Eldwh」）
password = Eldwh
; 首次运行回填最近几天；之后只跟新帖
backfill_days = 7
min_free_gb = 3
request_timeout = 120
; 下载读超时（秒）：节点「连上但不来数据」时 30 秒就判定并换节点，
; 不再像以前那样干等 120 秒。request_timeout 仍用于 API 调用。
read_timeout = 30
; 同一个帖子内并发下载的图片/文件数。1 = 退回串行；实测 4 最稳，
; 8 会互相抢带宽反而更慢。API 调用仍然串行并遵守站点的限流。
download_workers = 4
; arca 图床（ac-o.arca.live）4 并发实测会回 429，图片单独限制为 2；
; 被限流时程序会按 Retry-After 退避重试。
image_workers = 2
; kio 大文件（如 100MB 的 zip）按 16MB 分段并行下载的连接数。
segment_workers = 4
; 达到 retry 次后标记 failed 并提醒；之后仍自动重试 auto_retry_rounds 轮，
; 间隔指数增长（15 → 30 → 60 ... 分钟，封顶 240）。用尽后在看板点「重试」。
retry = 3
auto_retry_rounds = 5
retry_backoff_minutes = 15
retry_backoff_max_minutes = 240
; 每个文件下载完后的固定等待（秒）。API 限流已在各自客户端里处理，
; 这里设 0 免得几十个小文件白等几十秒。
delay_seconds = 0
max_run_minutes = 90
state_file = state.arca_downloads.json
; nahida.live/akasha/link 分享链接：用真实 Chrome（屏幕外窗口）打开分享页，
; 页面自己的 Turnstile 一般十几秒自动通过；带密码的链接自动填上面的共享密码。
; 拿到 nhd-link-token 后列目录/下载都走 API，token 缓存 12 小时。
; Chrome 路径留空 = 自动找 Chrome / Edge；link_timeout 是单条链接等 Turnstile 的上限。
; 链接失效或密码不对时仍会写进当天「arca_需手动下载.txt / .html」。
chrome_path =
link_timeout = 180
; 频道公共 Mod 方舟（모드방주）的 nahida 分享链接。帖子正文只写
; 「챈방주 내닉폴더에 있음」、不挂外链时，按作者昵称去方舟里找当天新增的目录。
; 留空则关闭这条路径。
ark_link = https://nahida.live/akasha/link/c3ebbc4b-3454-4541-a441-5465e42b4548
; 自动跳过的分类（匹配 CSV「分类」列，子串、大小写不敏感，逗号分隔）。
; 默认跳过终末地（엔드필드 모드 / enFielMd），只留鸣潮 Mod；清空则全部下载。
skip_categories = 엔드필드 모드,enFielMd
