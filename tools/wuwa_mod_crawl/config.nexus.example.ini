[site]
; 来源名：决定本地/云端子文件夹名
; 注意：**不能含空格**（本地 sync.ps1 把路径传给 scp.exe 时会出错）
source_name = NexusMods
; 游戏域名（nexusmods.com/<domain>）
domain = wutheringwaves
; 免费申请：https://www.nexusmods.com/users/myaccount?tab=api
api_key =

[notify]
enabled = true
; PushPlus token（主通道，免费实名用户 200 次/天；留空则只用 Server酱）
pushplus_token =
; Server酱 SendKey（兜底：PushPlus 失败时才用）
serverchan_key =

[storage]
out_dir = out
state_file = state.nexus.json
csv_encoding = utf-8-sig

[poll]
interval_minutes = 30
first_run_baseline = true
http_timeout = 30
retry = 3
