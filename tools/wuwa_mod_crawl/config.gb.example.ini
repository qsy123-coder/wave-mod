[site]
; 来源名：决定汇总子文件夹名
source_name = GameBanana
; 鸣潮在 GameBanana 的 game id
game_id = 20357

[notify]
enabled = true
; PushPlus token（主通道，免费实名用户 200 次/天；留空则只用 Server酱）
pushplus_token =
; Server酱 SendKey（兜底：PushPlus 失败时才用）
serverchan_key =
desktop_toast = true

[storage]
; 本地汇总目录（绝对路径）
out_dir = D:\BaiduNetdiskDownload\MC-MOD整合包\wMOD全集-每日更新\A_每日更新\_Mod每日汇总
state_file = state.gb.json
csv_encoding = utf-8-sig

[poll]
interval_minutes = 15
first_run_pages = 5
; 只要哪些内容类型（GameBanana 的 Subfeed 混着 Question/Tutorial/Tool）
; 可填 Mod / Tool / Tutorial / Question，逗号分隔；留空表示全都不要过滤
model_types = Mod
; 每次最多回溯几页（防止异常时无限翻页）
max_backfill_pages = 20
; 每轮翻几页「最近活动」排序（JASM 商店首页口径，能抓到只改页面的更新）
poll_pages = 4
; 每轮翻几页「发布时间」排序（兜底冷门新 Mod）
new_pages = 3
; 更新回溯时间窗（小时）：翻到这个时间之前的记录就停
update_window_hours = 72
http_timeout = 30
retry = 3

[net]
; 代理：auto=读系统代理并探测常见端口（Clash Verge 7897 等）
;       off/直连=强制不走代理（直连只有 20~80KB/s，慢约 8 倍）
;       也可以直接填 http://127.0.0.1:7897
proxy = auto
; 探测不到代理端口时自动拉起客户端（无人值守计划任务必需，否则只会走直连）
autostart = true
; 代理端口通、但目标站点访问不了（节点掉线）时，自动通过 Clash Verge 的
; 命名管道 \\.\pipe\verge-mihomo 切到一个能访问目标站点的节点；切不了再直连。
auto_switch_node = true
; 代理客户端路径；留空则在常见安装位置里找（Clash Verge 等）
app_path =
; 拉起后最多等多少秒让端口就绪
autostart_wait = 40

[download]
; 原图 + Mod 附件本地化（由独立计划任务 GameBananaModDownload 执行）
; 图片和 Mod 附件直接落在 <dest_dir>\W-YYYY.MM.DD\ 里，不再分「原图/Mod文件」子目录。
; 日期按下载任务的执行日归档（不是 Mod 发布时间）：关机期间发布的 Mod
; 在开机下载那天归档，例如 29 日发布、30 日才下载 → 进 W-2026.10.30。
enabled = true
; 分发根目录；当天的 W-YYYY.MM.DD 文件夹已存在就直接复用，不存在才新建
dest_dir = D:\BaiduNetdiskDownload\MC-MOD整合包\wMOD全集-每日更新\A_每日更新
; 日期文件夹前缀，与手工整理的 W-2026.10.30 保持一致
folder_prefix = W-
images = true
files = true
; 老 Mod 发现新文件时的落盘子目录（相对当天来源文件夹）。
; 已下载过的图片/附件按 URL 复用、不再重复下载，只有新文件落这里。
update_subdir = 更新
; 剩余空间低于多少 GB 时暂停下载并推送提醒
min_free_gb = 3
request_timeout = 120
; 单个 Mod 连续失败达到 retry 次后标记为 failed 并推送提醒；
; 之后仍会自动重试 auto_retry_rounds 轮（间隔从 retry_backoff_minutes
; 开始翻倍，封顶 retry_backoff_max_minutes）。用尽后在看板点「重试」。
retry = 3
auto_retry_rounds = 5
retry_backoff_minutes = 15
retry_backoff_max_minutes = 240
delay_seconds = 1
image_workers = 4
max_run_minutes = 120
; 下载前先测当前节点的真实吞吐，低于阈值就自动换节点（延迟低 ≠ 下载快）
auto_switch_slow = true
slow_threshold_kbps = 300
state_file = state.gb_downloads.json

[report]
; 把本机状态推给服务器（可选；推送失败不影响采集）
enabled = false
server = ubuntu@your-server
ssh_key = ~/.ssh/your_key
remote_dir = /home/ubuntu/kekehxl-watcher/status
timeout = 25
