[site]
; 来源名：决定归档子文件夹名
; 注意：**不能含空格**（与其它来源同理）
source_name = Patreon

[creators]
; 监测的 Patreon 作者，每行一个：<vanity> = <campaign id>
;   vanity 就是 patreon.com/<vanity> 里的那截（如 https://www.patreon.com/c/shaojiang/home → shaojiang）
;   campaign id 可以留空 —— 程序会自动按 vanity 解析，并缓存进 state
;
; ⚠️ 别去第三方站（如 graphtreon）抄 creatorId：那是 **user id 不是 campaign id**。
;    抄错会得到 ViewForbidden，看起来像"这个作者是私密的"，其实是 id 用错了。
;
; ⚠️ vanity **大小写敏感**：它同时用作归档目录名和状态文件名
;    （Puddingow → out/Patreon/Puddingow/ + state.patreon.Puddingow.json）。
;
; 行尾可以写 `; 说明` 做备注，解析器认行内注释（见 poller.load_config）。
;
; 产出**按作者分目录**：out/Patreon/<vanity>/ 各一份 CSV / images / index.html，
; 同步回本机就是 _Mod每日汇总/Patreon/<vanity>/。
;
; 加一个作者 = 加一行，重启服务即可。新作者首轮会**全量建档但不推送通知**。
shaojiang      = 14019274   ; EnteleJiang
Morning__Star  = 15101293   ; 晨星

[auth]
; Patreon session_id —— 读自**独立文件**，值不要写在这里。
;
; 为什么要登录：campaign 标了 is_nsfw 时，匿名拿到的预览图是**服务端烤糊的**
; （URL 里带 CDN 变换参数 {"b":70}，改不了、绕不过）。带上有效 session_id 后
; image.url 变成清晰的 {"w":620}。详见 README「Patreon 预览图去模糊」。
;
; 取值方法：登录 patreon.com → F12 → Application → Cookies → patreon.com
;          → 找 session_id 复制 Value（HttpOnly，Console 里 document.cookie 看不到）
;
; 拿到后写进独立文件（内容就是裸值一行），部署到服务器后 chmod 600。
; ⚠️ 它等同账号登录凭据，别提交进版本库。
;
; 留空 = 匿名模式（能跑，但预览图是模糊的）。
session_file = patreon_session.txt

[notify]
enabled = true
; PushPlus token（主通道，免费实名用户 200 次/天；留空则只用 Server酱）
pushplus_token =
; Server酱 SendKey（兜底：PushPlus 失败时才用）
serverchan_key =

[storage]
out_dir = out
state_file = state.patreon.json
csv_encoding = utf-8-sig

[poll]
; 接口无速率限制响应头，作者发帖频率也低（shaojiang 137 条 / 18 个月），60 分钟足够
interval_minutes = 60
; 每页条数，实测可到 100
page_size = 100
; 首次运行最多翻几页（全量建档 137 条 = 2 页）
first_run_max_pages = 40
; 日常每轮最多回溯几页（新帖都在头部，1 页通常就够）
max_backfill_pages = 5
; 只要哪些帖子类型（post_type），逗号分隔；留空表示全都不过滤
; image_file = 带图的 Mod 帖，text_only = 纯文本公告
post_types =
http_timeout = 30
retry = 3
