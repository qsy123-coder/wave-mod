# 根域发布页（永久入口）—— 静态站，直连本机，不经过 Cloudflare。
#
# 背景：2026-11-20 根域原先是 CNAME → wavemod-hub.pages.dev + 橙云代理，
# 大陆访客被 CF 免费版调度到 LAX（cf-ray ...-LAX），TLS 握手实测 15–67 秒抖动，
# 发布页「加载好久才进去」。改为灰云 A 记录 + 本机 nginx 静态站。
#
# 单独一个文件：scripts/deploy-hk-app.sh 只会重写 conf.d/wavemod-proxy.conf，
# 不碰 sites-enabled，重跑部署不会把本文件抹掉。
#
# 证书由 certbot --nginx 管理（renewal: /etc/letsencrypt/renewal/sunnyrose.xyz.conf），
# 保留下面带 `managed by Certbot` 标记的行，续期时 certbot 会就地替换。

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sunnyrose.xyz www.sunnyrose.xyz;

    ssl_certificate /etc/letsencrypt/live/sunnyrose.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sunnyrose.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Cache-Control "public, max-age=300" always;

    root /var/www/sunnyrose;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sunnyrose.xyz www.sunnyrose.xyz;

    # certbot 续期走 nginx 插件，但保留 webroot 兜底：
    # server 级 return 会短路所有 location，所以跳转必须写在 location 里。
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
